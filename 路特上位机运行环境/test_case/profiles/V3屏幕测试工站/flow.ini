[Flow]
Items="扫描连接蓝牙,进入工厂模式,产测未完成写入,产测未完成读取,进入吸力测试模式,进入LCD颜色测试模式,设置LCD颜色(红),确认屏幕_红色,设置LCD颜色_绿,确认屏幕_绿色,设置LCD颜色_蓝,确认屏幕_蓝色,设置LCD颜色_黑,确认屏幕_黑色,设置LCD颜色_白,确认屏幕_白色,设置LCD颜色_灰度,确认屏幕_灰度条,设置LCD颜色_灰,确认屏幕_灰色,退出LCD颜色测试模式,检查异响,退出工厂模式,恢复出厂,断开蓝牙连接,等待重启连接蓝牙,产测完成写入,产测完成读取"
StopFlowOnTestFail=true
FailItems=退出吸力测试模式

