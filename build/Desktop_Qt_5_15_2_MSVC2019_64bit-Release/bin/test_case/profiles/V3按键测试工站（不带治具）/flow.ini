[Flow]
Items="直连接蓝牙（不搜索）,进入工厂模式,模式键测试,电源键测试,程序键测试,左键测试,左旋键测试,右键测试,右旋键测试"
StopFlowOnTestFail=true

[SerialUi]
JigVisible=false
JigLabel=治具串口
ProductVisible=false
ProductLabel=产品串口(仪器)
UsbVisible=false
UsbLabel=万用表串口
; 原「测试详细配置」— 本工站流程含按键ID/电容卡控，改本 flow.ini
[KeyCap]
Low=1
High=65535
ReadTimeoutMs=5000
ReadCount=3
ReadIntervalMs=80
SingleReadTimeoutMs=2000
ValueEndian=big

[ProductInfo]
