KeyIdPower_checkBox=true
KeyIdStartPause=2
KeyIdStartPause_checkBox=true
KeyIdMode=3
KeyIdMode_checkBox=true
KeyIdSpeed=4
KeyIdSpeed_checkBox=true
KeyIdProgram=5
KeyIdProgram_checkBox=true
KeyIdLeft=6
KeyIdLeft_checkBox=true
KeyIdRight=7
KeyIdRight_checkBox=true
KeyIdLeftRotate=10
KeyIdLeftRotate_checkBox=true
KeyIdRightRotate=11
KeyIdRightRotate_checkBox=true
