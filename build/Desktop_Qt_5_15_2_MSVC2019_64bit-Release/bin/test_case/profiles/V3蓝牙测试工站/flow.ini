[Flow]
Items="直连接蓝牙（不搜索）,进入工厂模式,读取版本号,获取MES SKU,获取BLE RSSI,获取电量信息,三元组云端登录（prod）,获取云端三元组,写入productID,写入deviceId,写入deviceSecret,读取设备三元组并比较,写入SN码,获取整机SN码,上报三元组写入记录,进入蓝牙非信令模式,产品串口仪器复位应答,产品串口开始接收2402_BLE1M,并联CMW播放2402_BLE1M,产品串口停止接收与PER,产品串口仪器复位应答,产品串口开始接收2440_BLE1M,并联CMW播放2440_BLE1M,产品串口停止接收与PER,产品串口仪器复位应答,产品串口开始接收2480_BLE1M,并联CMW播放2480_BLE1M,产品串口停止接收与PER"
