[Flow]
Items="直连接蓝牙（不搜索）,进入工厂模式,读取版本号,获取BLE RSSI,获取电量信息,三元组云端登录（dev）v3,获取云端三元组,写入整机SN（云端）,写入productID,写入deviceId,写入deviceSecret,读取设备三元组并比较,上报三元组写入记录,产品串口仪器复位应答,并联CMW播放2402_BLE1M,产品串口开始接收2402_BLE1M,产品串口停止接收与PER,产品串口仪器复位应答,并联CMW播放2440_BLE1M,产品串口开始接收2440_BLE1M,产品串口停止接收与PER,产品串口仪器复位应答,并联CMW播放2480_BLE1M,产品串口开始接收2480_BLE1M,产品串口停止接收与PER"
StopFlowOnTestFail=true

[SerialUi]
JigVisible=false
JigLabel=治具串口
ProductVisible=true
ProductLabel=产品串口(仪器)
UsbVisible=false
UsbLabel=万用表串口
; 原「测试详细配置」— 本工站流程含 CMW/PER 测包，改本 flow.ini
[BrushInstrument]
InstrumentSendPacketCount=1000
MaxPer=0.05
PacketPhaseWaitMs=2000
StopAckTimeoutMs=5000

[FreeInstrument]
BleBrushCmwConcurrent=false
BleBrushCmwOnStopPer=true

[BlePer]
EnableRxTest=true
ScenarioList=2402:1M,2440:1M,2480:1M
TxCount=1000
CmwVisaAddress=
CmwWaveformFile=@WAVEFORM\\BT_LE_TestPacket_P9_1M.wv
CmwArbCycles=1000
CmwTxPowerDbm=-50
CmwTimeoutMs=5000
CmwEnableFixedInit=true
CmwVisaTrace=true
CmwBurstPollArbScount=true
CmwArbPollIntervalMs=100
CmwTriggerWaitMs=1000
CmwQueryCurrentArbFile=true
